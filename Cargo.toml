[package]
name = "cautious-waffle"
version = "0.6.1"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
#axum-macros = "0.5"
axum-server = "0.8"
clap = { version = "4.0", features = ["cargo"] }
env_logger = "0.11"
headers = "0.4"
hyper = { version = "1.6", features = ["http2"] }
log = { version = "0.4", features = [
    "release_max_level_debug",
    "max_level_debug",
] }
notify = "^8.0"
oneshot = { version = "0.2", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "socks",
    "json",
    "query",
] }
serde = "1"
serde_derive = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
uuid = "1"
